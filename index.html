<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우봉고 돌리기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 배치: 위 막대(모둠·맞힌 수·타이머) / 왼쪽 문제판 · 오른쪽 남은 조각과 고르기 버튼 */
  :root {
    --bg: #1E3550; --bg-2: #2B4C72; --bg-3: #152A41;
    --paper: #EEF5FB; --ink: #14213D; --sun: #FFC53D;
    --text: #F4F7FB; --muted: #A9BCD0; --good: #2FB344; --bad: #FF6B6B;
    --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    --body: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
    --top: clamp(60px, 10vh, 120px);
    color-scheme: dark;
    font-size: clamp(14px, 0.9vw + 0.4vh, 30px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--body);
    touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: none; }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0 / 22px 22px, var(--bg);
  }

  /* ---------- 위 막대 ---------- */
  #topbar {
    flex: none; height: var(--top); display: flex; align-items: center; gap: 1.2rem;
    padding: 0 1rem 0 1.4rem; background: var(--bg-3); border-bottom: 4px solid #0E1D2E;
  }
  .brand { font-family: var(--display); font-size: 1.6rem; display: flex; align-items: center; gap: .5rem; white-space: nowrap; }
  .brand svg { width: 1.6em; height: 1.6em; }
  #teamChip {
    font-family: var(--display); font-size: 1.7rem; color: var(--ink); background: var(--sun);
    border-radius: 999px; padding: .2rem 1.1rem; white-space: nowrap;
  }
  #scoreBox { display: flex; align-items: baseline; gap: .4rem; white-space: nowrap; }
  #scoreBox small { color: var(--muted); font-size: 1rem; }
  #score { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--sun); font-variant-numeric: tabular-nums; }
  #score.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  .spacer { flex: 1; }
  #timerBox { width: 10rem; text-align: center; flex: none; }
  #timer { font-family: var(--display); font-size: 2.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
  #timerBar { height: .55rem; border-radius: 99px; background: rgba(255,255,255,.12); margin-top: .35rem; overflow: hidden; }
  #timerBar i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 99px; transition: width .2s linear; }
  #timerBox.low #timer { color: var(--bad); animation: throb 1s infinite; }
  #timerBox.low #timerBar i { background: var(--bad); }
  @keyframes throb { 50% { transform: scale(1.08); } }
  #gear { flex: none; width: 3rem; height: 3rem; border-radius: 12px; background: var(--bg-2); display: grid; place-items: center; box-shadow: 0 4px 0 #0E1D2E; }
  #gear svg { width: 60%; height: 60%; }

  /* ---------- 본문 ---------- */
  #main { flex: 1; min-height: 0; display: flex; gap: 1rem; padding: 1rem; }
  #boardPanel { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #sidePanel {
    flex: var(--sg, 1) 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .6rem;
    background: var(--bg-3); border-radius: 22px; padding: .9rem 1rem; box-shadow: inset 0 4px 14px rgba(0,0,0,.35);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .head h2 { margin: 0; font-family: var(--display); font-weight: normal; font-size: 1.6rem; white-space: nowrap; }
  .head p { margin: 0; color: var(--muted); font-size: 1rem; }
  #boardArea { flex: 1; min-height: 0; position: relative; }
  #board { position: absolute; overflow: visible; filter: drop-shadow(0 10px 0 rgba(8,18,30,.45)); }
  #board .hole { animation: hole 1.6s ease-in-out infinite; }
  @keyframes hole { 50% { opacity: .45; } }
  #board.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  #board .fill-in { animation: fillin .4s cubic-bezier(.3,1.5,.5,1); transform-box: fill-box; transform-origin: center; }
  @keyframes fillin { 0% { transform: scale(1.15); opacity: .4; } 100% { transform: none; opacity: 1; } }

  #cols { flex: 1; min-height: 0; display: grid; gap: .8rem; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); }
  #cols[data-n="2"] { --n: 2; } #cols[data-n="3"] { --n: 3; }
  .pcol { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .5rem; border-radius: 16px; transition: box-shadow .2s; }
  .pcol.bad { box-shadow: 0 0 0 4px var(--bad); }
  .pcol.ready .pcard { box-shadow: inset 0 0 0 3px var(--sun); cursor: grab; }
  .pcol.ready .pcard::after { content: '판으로 끌어다 놓아요'; position: absolute; left: 0; right: 0; bottom: .4rem; text-align: center; font-family: var(--display); font-size: 1rem; color: var(--sun); pointer-events: none; }
  .pcol.placed .pwrap { opacity: .18; }
  .pcol.placed .pcard::after { content: '판에 놓았어요'; position: absolute; left: 0; right: 0; bottom: .4rem; text-align: center; font-family: var(--display); font-size: 1rem; color: #8CE99A; pointer-events: none; }
  .pcol.dragging .pwrap { opacity: .25; }
  #ghostLayer { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  .ghost { position: absolute; left: 0; top: 0; will-change: transform; filter: drop-shadow(0 14px 12px rgba(0,0,0,.45)); }
  .ghost.back { transition: transform .3s cubic-bezier(.2,.9,.25,1), opacity .3s; opacity: 0; }
  #sidePanel.drag #btnCheck { display: none; }
  .plabel { font-family: var(--display); font-size: 1.3rem; text-align: center; color: var(--sun); }
  .pcard {
    flex: 1; min-height: 0; position: relative; border-radius: 16px;
    background: radial-gradient(circle, rgba(255,255,255,.07) 1.5px, transparent 0) 0 0 / 24px 24px, #10233A;
    display: grid; place-items: center; overflow: hidden;
  }
  .pwrap { transition: transform .75s cubic-bezier(.45,.05,.3,1); }
  .pwrap.instant { transition: none; }
  .pwrap svg { display: block; overflow: visible; }
  .parrow { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .parrow.show { opacity: 1; }
  #choice { font-family: var(--display); font-size: 1.4rem; text-align: center; min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #choice em { font-style: normal; color: var(--sun); }
  #choice.wrong { color: var(--bad); }
  #choice.right { color: #8CE99A; }

  .pick { display: grid; gap: .5rem; }
  .pick.dir { grid-template-columns: 1fr 1fr; }
  .pick.ang { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #cols:not([data-n="1"]) .pick.dir { grid-template-columns: 1fr; }
  .opt {
    min-height: 3.3rem; border-radius: 14px; background: var(--bg-2); box-shadow: 0 5px 0 #0E1D2E;
    font-family: var(--display); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: .4rem; white-space: nowrap;
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  #cols:not([data-n="1"]) .opt { min-height: 2.9rem; font-size: 1.2rem; }
  #cols[data-n="3"] .pick.ang .opt { font-size: 1.05rem; padding: 0; }
  #cols[data-n="3"] .pick.ang { gap: .35rem; }
  .opt svg { width: 1.6em; height: 1.6em; flex: none; }
  .opt:active { transform: translateY(4px); box-shadow: 0 1px 0 #0E1D2E; }
  .opt.on { background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 #8FA6BE; }
  .opt:disabled { opacity: .4; pointer-events: none; }
  #btnCheck {
    min-height: 3.7rem; border-radius: 16px; background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 #B07F12;
    font-family: var(--display); font-size: 1.8rem; transition: transform .08s, box-shadow .08s;
  }
  #btnCheck:active { transform: translateY(5px); box-shadow: 0 1px 0 #B07F12; }
  #btnCheck:disabled { opacity: .35; pointer-events: none; }

  #app.portrait #main { flex-direction: column; }
  #app.portrait .pcard { min-height: 8vh; }
  #app.compact .brand span, #app.compact .head p { display: none; }
  #app.compact #topbar { gap: .7rem; }

  /* ---------- 창 ---------- */
  #modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(9,19,32,.62); }
  #modal[hidden] { display: none; }
  #card {
    width: min(94vw, 44rem); max-height: 92vh; overflow: auto; touch-action: pan-y; word-break: keep-all;
    background: var(--paper); color: var(--ink); border-radius: 26px; padding: 1.7rem 2rem;
    border: 5px solid var(--ink); box-shadow: 0 12px 0 rgba(0,0,0,.35); animation: pop .28s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  #card h3 { font-family: var(--display); font-weight: normal; font-size: 2.3rem; margin: 0 0 .5rem; text-wrap: balance; }
  #card p, #card li { font-size: 1.15rem; line-height: 1.55; }
  #card p { margin: 0 0 .8rem; }
  #card ul { margin: 0 0 .8rem; padding-left: 1.3rem; }
  .big { font-family: var(--display); font-size: 4.5rem; line-height: 1; color: #C2410C; margin: .2rem 0 .6rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .45rem 0; font-size: 1.1rem; flex-wrap: wrap; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: #D5E1EC; border-radius: 12px; padding: 4px; }
  .seg button { background: transparent; border-radius: 9px; padding: .45rem .85rem; font-family: var(--display); font-size: 1.05rem; color: #5A6E86; }
  .seg button.on { background: var(--ink); color: #fff; }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; margin-top: 1.1rem; }
  .btn { border-radius: 14px; min-height: 3.2rem; padding: .45rem 1.2rem; background: var(--bg-2); color: var(--text); font-family: var(--display); font-size: 1.2rem; box-shadow: 0 4px 0 #0E1D2E; }
  .btn.primary { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 #B07F12; }
  .note { font-size: .95rem; color: #5A6E86; }
  table.res { width: 100%; border-collapse: collapse; margin-top: .3rem; font-variant-numeric: tabular-nums; }
  table.res th { text-align: left; font-weight: normal; color: #5A6E86; font-size: .95rem; padding: .3rem .4rem; }
  table.res td { padding: .5rem .4rem; border-top: 2px solid #D5E1EC; font-size: 1.2rem; }
  table.res td:first-child, table.res td:nth-child(3) { font-family: var(--display); font-size: 1.45rem; }
  table.res tr.first td { background: #FFF3BF; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; }
  #count { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-size: 30vmin; color: var(--sun); text-shadow: 0 1.2vmin 0 rgba(0,0,0,.35); }
  #count[hidden] { display: none; }
  #count span { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 3 3" aria-hidden="true"><rect x="0" y="0" width="2" height="1" fill="#FF6B6B"/><rect x="2" y="0" width="1" height="2" fill="#339AF0"/><rect x="0" y="1" width="1" height="2" fill="#FCC419"/><rect x="1" y="1" width="1" height="1" fill="#F4F7FB" opacity=".35"/><rect x="1" y="2" width="2" height="1" fill="#845EF7"/></svg>
      <span>우봉고 돌리기 퀴즈</span>
    </div>
    <div id="teamChip">1모둠</div>
    <div id="scoreBox"><small>맞힌 문제</small><b id="score">0</b></div>
    <span class="spacer"></span>
    <div id="timerBox"><div id="timer">1:00</div><div id="timerBar"><i></i></div></div>
    <button id="gear" aria-label="선생님 메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <main id="main">
    <section id="boardPanel">
      <div class="head"><h2 id="qTitle">문제 1</h2><p>점선 칸이 비어 있어요.</p></div>
      <div id="boardArea"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </section>
    <section id="sidePanel">
      <div class="head"><h2>남은 조각</h2><p>얼마나 돌리면 빈칸에 딱 맞을까요?</p></div>
      <div id="cols" data-n="1"></div>
      <div id="choice">방향과 각도를 골라요</div>
      <button id="btnCheck" disabled>확인</button>
    </section>
  </main>
  <div id="ghostLayer"></div>
  <canvas id="fx"></canvas>
  <div id="count" hidden></div>
  <div id="modal" hidden><div id="card" role="dialog" aria-modal="true"></div></div>
</div>
<script>
/* 우봉고 돌리기 퀴즈 – 조각 몇 개는 이미 채워진 문제판에서, 남은 조각(1~3개)을
 * 어느 방향으로 몇 도 돌려야 빈칸에 맞는지 고른다. 모둠마다 제한 시간 안에 몇 문제 맞히는지 겨룬다.
 */
(() => {
'use strict';

/* ---------- 조각과 문제 만들기 ---------- */
const PIECES = [
  { color: '#FF6B6B', cells: [[0,0],[1,0]] },
  { color: '#FF922B', cells: [[0,0],[1,0],[2,0]] },
  { color: '#FCC419', cells: [[0,0],[0,1],[1,1]] },
  { color: '#94D82D', cells: [[0,0],[1,0],[2,0],[3,0]] },
  { color: '#40C057', cells: [[0,0],[0,1],[0,2],[1,2]] },
  { color: '#20C997', cells: [[0,0],[1,0],[2,0],[1,1]] },
  { color: '#339AF0', cells: [[1,0],[2,0],[0,1],[1,1]] },
  { color: '#5C7CFA', cells: [[0,0],[1,0],[0,1],[1,1]] },   // 네모: 돌려도 같아서 빈칸 조각으로는 안 씀
  { color: '#845EF7', cells: [[0,0],[1,0],[0,1],[1,1],[0,2]] },
  { color: '#CC5DE8', cells: [[0,0],[0,1],[0,2],[0,3],[1,3]] },
  { color: '#F06595', cells: [[0,0],[1,0],[2,0],[1,1],[1,2]] },
  { color: '#C0875A', cells: [[0,0],[2,0],[0,1],[1,1],[2,1]] },
];
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = cells => {
  let mx = Infinity, my = Infinity;
  for (const [x, y] of cells) { if (x < mx) mx = x; if (y < my) my = y; }
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
};
const rotCW = c => norm(c.map(([x, y]) => [-y, x]));
const flipX = c => norm(c.map(([x, y]) => [-x, y]));
const rotN = (c, k) => { let r = norm(c); for (let i = 0; i < ((k % 4) + 4) % 4; i++) r = rotCW(r); return r; };
const keyOf = c => c.map(p => p.join(',')).join(';');
const dims = c => { let w = 0, h = 0; for (const [x, y] of c) { if (x + 1 > w) w = x + 1; if (y + 1 > h) h = y + 1; } return { w, h }; };
function orientations(cells) {
  const out = [], seen = new Set(); let c = norm(cells);
  for (let f = 0; f < 2; f++) { for (let r = 0; r < 4; r++) { const k = keyOf(c); if (!seen.has(k)) { seen.add(k); out.push(c); } c = rotCW(c); } c = flipX(c); }
  return out;
}
const ORIENTS = PIECES.map(p => orientations(p.cells));
const TARGETS = PIECES.map((p, i) => i).filter(i => i !== 7);

// 조각들을 이어 붙여 빈틈없는 모양을 만들고, 각 조각이 어디에 놓였는지도 기억한다
function buildShape(combo) {
  const occ = new Map(), place = [];
  const has = (x, y) => occ.has(x + ',' + y);
  const o0 = ORIENTS[combo[0]][rand(ORIENTS[combo[0]].length)];
  o0.forEach(([x, y]) => occ.set(x + ',' + y, 0)); place.push({ piece: combo[0], cells: o0, gx: 0, gy: 0 });
  for (let i = 1; i < combo.length; i++) {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const s of occ.keys()) { const [x, y] = s.split(',').map(Number); minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
    const cands = [];
    for (const o of ORIENTS[combo[i]]) {
      const { w, h } = dims(o);
      for (let dy = miny - h; dy <= maxy + 1; dy++) for (let dx = minx - w; dx <= maxx + 1; dx++) {
        let ok = true, contact = 0;
        for (const [x, y] of o) {
          const X = x + dx, Y = y + dy;
          if (has(X, Y)) { ok = false; break; }
          contact += has(X + 1, Y) + has(X - 1, Y) + has(X, Y + 1) + has(X, Y - 1);
        }
        if (!ok || !contact) continue;
        const W = Math.max(maxx, dx + w - 1) - Math.min(minx, dx) + 1, H = Math.max(maxy, dy + h - 1) - Math.min(miny, dy) + 1;
        cands.push({ score: W * H - contact * .9 + Math.random() * 2.5, dx, dy, o });
      }
    }
    cands.sort((a, b) => a.score - b.score);
    const c = cands[rand(Math.min(3, cands.length))];
    c.o.forEach(([x, y]) => occ.set((x + c.dx) + ',' + (y + c.dy), i));
    place.push({ piece: combo[i], cells: c.o, gx: c.dx, gy: c.dy });
  }
  let mx = Infinity, my = Infinity;
  for (const s of occ.keys()) { const [x, y] = s.split(',').map(Number); mx = Math.min(mx, x); my = Math.min(my, y); }
  for (const p of place) { p.gx -= mx; p.gy -= my; }
  const shape = norm([...occ.keys()].map(s => s.split(',').map(Number)));
  return { shape, place };
}
function hasHole(cells) {
  const { w, h } = dims(cells), W = w + 2, H = h + 2, g = new Uint8Array(W * H);
  cells.forEach(([x, y]) => { g[(y + 1) * W + x + 1] = 1; });
  const st = [0]; g[0] = 2; let n = 1;
  while (st.length) {
    const i = st.pop(), x = i % W, y = (i / W) | 0;
    for (const [a, b] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (a < 0 || b < 0 || a >= W || b >= H) continue;
      const j = b * W + a; if (!g[j]) { g[j] = 2; n++; st.push(j); }
    }
  }
  return n + cells.length < W * H;
}

let CP = 60, splitKey = '';   // 남은 조각 한 칸 크기 (문제판 칸과 같음)
function layout() {
  const vw = innerWidth, vh = innerHeight;
  ui.app.classList.toggle('portrait', vw < vh * 1.05);
  ui.app.classList.toggle('compact', Math.min(vw, vh) < 700);
  buildCols(G.empty);
  const q = G.q, L = LIMITS[G.empty], cols0 = q ? q.w : L.w, rows0 = q ? q.h : L.h, pad = .45;
  // 칸 크기는 문제마다 바꾸지 않는다: 이 난이도에서 나올 수 있는 가장 큰 판과 가장 긴 조각(4칸)이 들어가는 크기.
  // 문제판 빈칸과 남은 조각을 늘 같은 칸 크기로 그리고, 그 크기가 가장 커지도록 왼쪽·오른쪽(세로 화면은 위·아래) 비율을 고른다
  const measure = () => {
    const ba = ui.boardArea.getBoundingClientRect();

    let cardMin = Infinity;
    cols.forEach(c => { const r = c.card.getBoundingClientRect(); cardMin = Math.min(cardMin, r.width, r.height); });
    return Math.floor(Math.min(CB, (cardMin - 16) / 4.3));

    ui.side.style.setProperty('--sg', best.g);
  }
  const ba = ui.boardArea.getBoundingClientRect();
  C = CP = Math.max(16, measure());
  const bw = (cols0 + pad * 2) * C, bh = (rows0 + pad * 2) * C;
  Object.assign(ui.board.style, { left: (ba.width - bw) / 2 + 'px', top: (ba.height - bh) / 2 + 'px', width: bw + 'px', height: bh + 'px' });

// 고른 방향을 조각 둘레의 화살표로 보여 준다 (각도만큼 호를 그림)
function drawArrow(i) {
  const a = cols[i].arrow, s = G.sel[i] || {};

  const ang = s.ang || 90, cw = s.dir === 'cw', r = 42, cx = 50, cy = 50;
  const start = -90, end = start + (cw ? Math.min(ang, 350) : -Math.min(ang, 350));
  const pt = t => [cx + r * Math.cos(t * Math.PI / 180), cy + r * Math.sin(t * Math.PI / 180)];
  const [x1, y1] = pt(start), [x2, y2] = pt(end), large = ang > 180 ? 1 : 0, sweep = cw ? 1 : 0;

  const hx = x2 + 7 * Math.cos(rad(tdir)), hy = y2 + 7 * Math.sin(rad(tdir));
  const l1 = [x2 + 5 * Math.cos(rad(end)), y2 + 5 * Math.sin(rad(end))], l2 = [x2 - 5 * Math.cos(rad(end)), y2 - 5 * Math.sin(rad(end))];

    `<polygon points="${hx},${hy} ${l1[0]},${l1[1]} ${l2[0]},${l2[1]}" fill="#FFC53D"/>`;

       <p>${menuFrom === 'play' ? `${G.cur + 1}모둠 시간이 잠깐 멈췄어요. 닫으면 이어서 해요.` : '게임을 처음부터 다시 시작할 수 있어요.'}</p>
       <div class="row"><span>효과음</span>${segHtml('snd', [[1, '켜기'], [0, '끄기']], G.sound ? 1 : 0)}</div>`,
      [{ label: '처음부터 (설정)', fn: openSetup }, { label: menuFrom === 'play' ? '이어서 하기' : '닫기', primary: true, fn: closeMenu }], 'menu');
    ui.card.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { G.sound = b.dataset.v === '1'; render(); }));
  };
  render();
}
function closeMenu() {
  hideModal();
  if (menuFrom === 'play' && G.phase === 'paused') {
    G.phase = 'play'; G.endAt = Date.now() + pausedLeft;
    clearInterval(G.timerId); G.timerId = setInterval(tick, 150); tick(); updatePick();
  }
}
$('#gear').addEventListener('click', () => { unlockAudio(); openMenu(); });

/* ---------- 소리와 효과 ---------- */
let AC = null;
function unlockAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; } } if (AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', vol = .12, delay = 0) {
  if (!AC || !G.sound) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .03);
}
function sfx(k) {
  if (k === 'tap') tone(620, .05, 'triangle', .06);
  if (k === 'tick') tone(880, .06, 'square', .04);
  if (k === 'spin') [440, 520, 600].forEach((f, i) => tone(f, .1, 'triangle', .05, i * .18));
  if (k === 'right') { tone(160, .14, 'sine', .3); tone(1250, .035, 'square', .05); [784, 1047].forEach((f, i) => tone(f, .14, 'triangle', .1, .06 + i * .09)); }
  if (k === 'wrong') { tone(220, .18, 'sawtooth', .06); tone(180, .22, 'sawtooth', .05, .12); }
  if (k === 'go') [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .1, i * .09));
  if (k === 'over') [392, 330, 262].forEach((f, i) => tone(f, .28, 'triangle', .08, i * .16));
  if (k === 'win') [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .12, i * .1));
}
function fxCtx() { const cv = ui.fx, ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx; }
function sparkleHole() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = ui.board.getBoundingClientRect(), q = G.q, pad = .45, cs = r.width / (q.w + pad * 2), ctx = fxCtx(), sp = [];
  for (const [x, y] of q.hole) for (let i = 0; i < 5; i++) {
    const a = Math.random() * 7, v = 3 + Math.random() * 5;
    sp.push({ x: r.left + (x + pad + .5) * cs, y: r.top + (y + pad + .5) * cs, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 3 + Math.random() * 4 });
  }
  const t0 = performance.now();
  (function f(t) { const k = (t - t0) / 500; ctx.clearRect(0, 0, innerWidth, innerHeight); if (k >= 1) return;
    for (const p of sp) { p.x += p.vx; p.y += p.vy; p.vx *= .9; p.vy *= .9; ctx.globalAlpha = 1 - k; ctx.fillStyle = '#FFE066'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; requestAnimationFrame(f); })(t0);
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = fxCtx(), cols = PIECES.map(p => p.color);
  const ps = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 24, vy: -Math.random() * 20 - 6, s: 8 + Math.random() * 12, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[rand(cols.length)] }));
  const t0 = performance.now();
  (function f(t) { ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const q of ps) { q.vy += .6; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 2, q.s, q.s); ctx.strokeStyle = '#14213D'; ctx.lineWidth = 2; ctx.strokeRect(-q.s / 2, -q.s / 2, q.s, q.s); ctx.restore(); }
    if (t - t0 < 2200) requestAnimationFrame(f); else ctx.clearRect(0, 0, innerWidth, innerHeight); })(t0);
}

/* ---------- 확대 막기 (두 번 터치·여러 손가락에도 화면이 커지지 않게) ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('#card')) e.preventDefault(); }, { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 350 && !e.target.closest('button')) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
const relayout = () => { clearTimeout(rt); rt = setTimeout(() => { layout(); drawBoard(); }, 100); };
addEventListener('resize', relayout);
if (window.visualViewport) visualViewport.addEventListener('resize', relayout);

/* ---------- 시작 ---------- */
layout(); showTime(G.timeLimit * 1000); updatePick();
openSetup();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); drawBoard(); });
})();
</script>
</body>
